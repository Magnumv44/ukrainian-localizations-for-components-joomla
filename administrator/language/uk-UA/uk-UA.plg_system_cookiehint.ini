PLG_SYSTEM_COOKIEHINT_HEAD="Ми використовуємо файли cookies"
PLG_SYSTEM_COOKIEHINT_INFO="<p>Ми використовуємо файли cookie на нашому сайті. Деякі з них є важливими для роботи сайту, тоді як інші допомагають нам покращити цей сайт і взаємодію з користувачем (файли cookie для відстеження). Ви можете самостійно вирішити, чи хочете ви дозволити файли cookie чи ні. Зауважте, що якщо ви їх відхилите, не всі функції сайту будуть працювати коректно з вашого боку.</p>"
PLG_SYSTEM_COOKIEHINT_BTN_INFO="Більше інформації"
PLG_SYSTEM_COOKIEHINT_BTN_IMPRINT="Вихідні дані"
PLG_SYSTEM_COOKIEHINT_BTN_OK="Ок"
PLG_SYSTEM_COOKIEHINT_BTN_NOTOK="Відхилити"
PLG_SYSTEM_COOKIEHINT_DESCRIPTION="<strong>CookieHint and Consent плагін для Joomla! 3.x/4.x/5.x/6.x</strong>"
PLG_SYSTEM_COOKIEHINT_LANGINFO="<i>Як встановити власний текст:</i><br /><br />Ви можете встановити наступні мовні константи через інтерфейс адміністрування.<br />Перейдіть до розділу Система > Перевизначення констант<br /><br />PLG_SYSTEM_COOKIEHINT_INFO<br />(Текст попередження/сповіщення про файли cookie за замовчуванням)<br /><br />PLG_SYSTEM_COOKIEHINT_BTN_INFO<br />(Текст посилання для отримання додаткової інформації)<br /><br />PLG_SYSTEM_COOKIEHINT_BTN_OK<br />(Текст кнопки надання згоди використання cookie)<br /><br />PLG_SYSTEM_COOKIEHINT_BTN_NOTOK<br />(Текст кнопки відмови надання згоди використання cookie)<br /><br />Не забудьте вибрати вірну мову для перевизначання мовних констант та розділ використання для сайту, а не панелі адміністрування."
PLG_SYSTEM_COOKIEHINT_NOTE_LINKS="Стиль"
PLG_SYSTEM_COOKIEHINT_NOTE_SETTINGS="Вигляд"
PLG_SYSTEM_COOKIEHINT_NOTE_STYLE="Налаштування"
PLG_SYSTEM_COOKIEHINT_MORE_INFO="Посилання на політику конфіденційності"
PLG_SYSTEM_COOKIEHINT_MORE_INFO_DESC="Це адреса, яка посилається на вашу сторінку з інструкціями щодо файлів cookie та додатковою інформацією. Залиште це поле порожнім, щоб приховати кнопку з додатковою інформацією."
PLG_SYSTEM_COOKIEHINT_CSS="CSS-стиль"
PLG_SYSTEM_COOKIEHINT_CSS_DESC="Якщо ви хочете змінити стиль cookie-hint, ви можете зробити це тут. Виберіть CSS-файл, який ви хочете використовувати. Ваш власний CSS-файл буде видимий і може бути вибраний, як тільки ваш файл буде завантажений у 'plugins/system/cookiehint/css'."
PLG_SYSTEM_COOKIEHINT_PHP="HTML/PHP-код"
PLG_SYSTEM_COOKIEHINT_PHP_DESC="Якщо ви хочете змінити повний макет cookie-hint, ви можете зробити це тут. Виберіть PHP-файл, який ви хочете використовувати. Ваш власний PHP-файл буде видно, і його можна буде вибрати, щойно ваш файл буде завантажено в 'plugins/system/cookiehint/include'."
PLG_SYSTEM_COOKIEHINT_POSITION="Позиція/Розташування"
PLG_SYSTEM_COOKIEHINT_POSITION_DESC="Позиція/Розташування сповіщення про файли cookie"
PLG_SYSTEM_COOKIEHINT_POSITION_TOP="Вгорі"
PLG_SYSTEM_COOKIEHINT_POSITION_BOTTOM="Знизу"
PLG_SYSTEM_COOKIEHINT_POSITION_MODAL="За замовчуванням (рекомендовано)"
PLG_SYSTEM_COOKIEHINT_TEST="Тест"
PLG_SYSTEM_COOKIEHINT_TEST_DESC="Тестування"
PLG_SYSTEM_COOKIEHINT_MODE="Режим"
PLG_SYSTEM_COOKIEHINT_MODE_DAYS="Сповіщення про файли cookie має бути оновлено через X днів (значення X: термін дії в днях)."
PLG_SYSTEM_COOKIEHINT_MODE_SESSION="Повідомлення про файли cookie необхідно повторно підтверджувати з кожним новим сеансом (відвідуванням сайту)."
PLG_SYSTEM_COOKIEHINT_REFUSAL="Дозволити відмову від файлів cookie"
PLG_SYSTEM_COOKIEHINT_REFUSAL_DESC="Якщо ви вибрали 'НІ', відмова від файлів cookie неможлива. За допомогою 'Переадресації' відвідувача буде перенаправлено на інформаційну сторінку, а також буде виключено з відвідування веб-сайту. Якщо встановлено значення 'Так', усі файли cookie блокуватимуться JavaScript до підтвердження."
PLG_SYSTEM_COOKIEHINT_REFUSAL_URL="URL-адреса перенаправлення через відмову від використання файлів cookie."
PLG_SYSTEM_COOKIEHINT_REFUSAL_URL_DESC="На цю URL-адресу буде перенаправлено ​​у разі відмови від використання файлів cookie."
PLG_SYSTEM_COOKIEHINT_COOKIEBLOCKER="Блокувальник файлів cookie"
PLG_SYSTEM_COOKIEHINT_COOKIEBLOCKER_DESC="Якщо ви виберете 'Увімкнути' то всі файли cookie блокуватимуться за допомогою JavaScript до моменту надання згоди ні їх використання."
PLG_SYSTEM_COOKIEHINT_COOKIEEXPIRES="Термін дії в днях"
PLG_SYSTEM_COOKIEHINT_COOKIEEXPIRES_DESC="Через X днів файли cookie будуть видалені з браузера (значення X: термін дії в днях)."
PLG_SYSTEM_COOKIEHINT_COOKIESECURE="Параметри безпеки Cookie"
PLG_SYSTEM_COOKIEHINT_COOKIESECURE_DESC="Ця опція вказує, чи файл cookie можна встановити лише за наявності безпечного з’єднання через HTTPS. Якщо встановлено значення 'так', файл cookie використовуватиметься лише тоді, коли встановлено безпечне з’єднання."
