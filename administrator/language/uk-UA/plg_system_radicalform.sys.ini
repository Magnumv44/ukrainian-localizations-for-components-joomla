PLG_RADICALFORM_CONTENT_RULE_REGEX_NOTE="<strong>Будь-яка адреса Gmail:</strong><br>/@gmail\.com$/i<br><br><strong>Адреса Gmail, у якій перед @ є крапка:</strong><br>/^[^@\s]+\.[^@\s]+@gmail\.com$/i<br><br><strong>Адреса Gmail з кількома сегментами, розділеними крапками (часто використовується спамерами):</strong><br>/^[^@\s]+(?:\.[^@\s]+){2,}@gmail\.com$/i<br><br><strong>Посилання у повідомленні:</strong><br>/(https?:\/\/|www\.)/i<br><br><strong>Типові спам-слова:</strong><br>/(casino|betting|slots|viagra)/iu<br><br><strong>Повідомлення містить лише латинські літери, цифри та символи без пробілів (типова ознака спаму):</strong><br>/^[A-Za-z0-9._-]{12,}$/<br><br><strong>i</strong> — без урахування регістру.<br><strong>u</strong> — коректна робота з UTF-8, включаючи кирилицю."
