PLG_RADICALFORM="Система - RadicalForm"
PLG_RADICALFORM_DESC="<p>Професійний підхід до створення форм зворотного зв'язку.<br /> Форму ви створюєте самостійно на сторінці сайту за допомогою HTML-тегів. <br />Щоб вона запрацювала, достатньо призначити кнопці відправлення CSS-клас <strong>rf-button-send</strong>.</p><p>Докладна документація — <a href='https://radicalmart.ru/all/radicalform' target='_blank'>https://radicalmart.ru/all/radicalform</a></p>"
PLG_RADICALFORM_VERSION="Версія плагіна: 4.2.4"
PLG_RADICALFORM_DANGER_CLASS="CSS-клас для невалідних полів"
PLG_RADICALFORM_DANGER_CLASS_DESCRIPTION="Для полів форми, які містять помилки, не пройшли перевірку або не були заповнені, хоча є обов'язковими, буде призначено цей CSS-клас. Можна вказати кілька класів через пробіл."
PLG_RADICALFORM_ERROR_FILE="CSS-клас повідомлень про помилки файлів"
PLG_RADICALFORM_ERROR_FILE_DESCRIPTION="CSS-клас для повідомлень про помилки під час завантаження файлів. Повідомлення відображаються у контейнері зі списком файлів, позначеному класом rf-filenames-list."
PLG_RADICALFORM_RF_CALL_0="Javascript №0 (виконується перед надсиланням форми)"
PLG_RADICALFORM_RF_CALL_0_DESCRIPTION="Javascript №0 виконується перед надсиланням форми. Доступні змінні 'here', яка містить посилання на натиснуту кнопку, та 'needReturn', яка містить результат перевірки форми і дорівнює true, якщо форма не пройшла валідацію. Поверніть false, щоб скасувати надсилання."
PLG_RADICALFORM_RF_CALL_1="Javascript №1"
PLG_RADICALFORM_RF_CALL_1_DESCRIPTION="Javascript №1 викликається після надсилання форми, якщо в кнопці задано параметр data-rf-call. Наприклад: data-rf-call='1'. Можна вказати кілька функцій, наприклад data-rf-call='12'. Доступні змінні here та rfMessage."
PLG_RADICALFORM_RF_CALL_2="Javascript №2 (виведення повідомлення)"
PLG_RADICALFORM_RF_CALL_2_DESCRIPTION="Javascript №2 зазвичай використовується для відображення повідомлення про успішне або неуспішне надсилання форми. Виконується після кожного надсилання. Змінна rfMessage містить текст повідомлення. Також доступна змінна here."
PLG_RADICALFORM_RF_CALL_3="Javascript №3"
PLG_RADICALFORM_RF_CALL_3_DESCRIPTION="Javascript №3 викликається, якщо в кнопці зазначено data-rf-call='3'. Доступні змінні here та rfMessage."
PLG_RADICALFORM_EMAIL="Адреса для надсилання листів"
PLG_RADICALFORM_WAIT_MESSAGE="Повідомлення «Зачекайте»"
PLG_RADICALFORM_DEFAULT_WAIT_MESSAGE="Зачекайте..."
PLG_RADICALFORM_WAIT_MESSAGE_DESCRIPTION="Під час надсилання повідомлення кнопка отримує стан disabled і змінює текст на зазначений. Можна використовувати HTML-теги, але не використовуйте апостроф (')."
PLG_RADICALFORM_EMAIL_CC="Надсилати копію листа"
PLG_RADICALFORM_EMAIL_BCC="Прихована копія листа"
PLG_RADICALFORM_AFTERSEND="Повідомлення після надсилання форми"
PLG_RADICALFORM_AFTERSEND_DESCRIPTION="Повідомлення, яке буде показано після успішного надсилання форми. Можна використовувати HTML-теги, але не використовувати апостроф (')."
PLG_RADICALFORM_MAXFILE="Максимальний розмір вкладень (МБ)"
PLG_RADICALFORM_MAXFILE_DESCRIPTION="Більшість поштових серверів мають обмеження приблизно 20 МБ на вкладення."
PLG_RADICALFORM_WAITING_FOR_UPLOAD="Повідомлення «Зачекайте» під час завантаження файлів"
PLG_RADICALFORM_WAITING_FOR_UPLOAD_DESCRIPTION="Під час завантаження файлу кнопка блокується та відображає цей текст. Можна використовувати HTML, але без апострофів."
PLG_RADICALFORM_ADVANCEDPARAMS="Інтеграція з іншими сервісами"
PLG_RADICALFORM_TELEGRAM_LABEL="Увімкнути Telegram"
PLG_RADICALFORM_TELEGRAM_DESCRIPTION="Увімкнути надсилання повідомлень через Telegram-бота."
PLG_RADICALFORM_TELEGRAM_TOKEN="HTTP API Token"
PLG_RADICALFORM_TELEGRAM_TOKEN_DESCRIPTION="HTTP API Token, отриманий у BotFather."
PLG_RADICALFORM_EMAILON_LABEL="Надсилання електронної пошти"
PLG_RADICALFORM_EMAILON_DESCRIPTION="Увімкнути надсилання електронної пошти після відправлення форми."
PLG_RADICALFORM_TELEGRAMCHECK_LABEL="Оновити chat_id"
PLG_RADICALFORM_TELEGRAMCHATIDCHOOSE_LABEL="Одержувачі Telegram"
PLG_RADICALFORM_TELEGRAMCHATIDCHOOSE_DESC="Виберіть одержувачів повідомлень Telegram. Для отримання chat_id надішліть повідомлення боту та натисніть кнопку «Оновити chat_id»."
PLG_RADICALFORM_MAX_LABEL="Увімкнути MAX"
PLG_RADICALFORM_MAX_DESCRIPTION="Увімкнути надсилання повідомлень через бот MAX."
PLG_RADICALFORM_MAX_TOKEN="Токен бота MAX"
PLG_RADICALFORM_MAX_TOKEN_DESCRIPTION="Токен HTTP API MAX, який можна отримати в налаштуваннях чат-бота MAX."
PLG_RADICALFORM_MAX_RECIPIENTS_LABEL="Одержувачі MAX"
PLG_RADICALFORM_MAX_RECIPIENTS_DESC="Виберіть одержувачів повідомлень MAX. Для надсилання використовується ID одержувача та тип адресації. Поле Name використовується лише як назва. Для отримання ID надішліть повідомлення боту MAX і натисніть кнопку оновлення."
PLG_RADICALFORM_MAX_CHECK_LABEL="Оновити MAX ID"
PLG_RADICALFORM_MAX_MARKER_INITIALIZED="Маркер оновлень MAX збережено. Надішліть нове повідомлення боту MAX і натисніть оновлення ще раз."
PLG_RADICALFORM_MAX_NO_RECIPIENTS="Нових повідомлень боту MAX не знайдено. Надішліть повідомлення боту та натисніть оновлення ще раз."
PLG_RADICALFORM_HISTORY="Історія надсилання форм"
