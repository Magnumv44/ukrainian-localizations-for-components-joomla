PLG_RADICALFORM_HISTORY_FILE_NO_VALID_ROWS="Файл журналу прочитано, але не знайдено коректних записів історії: <strong>%s</strong>"
PLG_RADICALFORM_HISTORY_FILE_NO_READABLE_ROWS="Файл журналу не порожній, але записи історії неможливо прочитати: <strong>%s</strong>"
PLG_RADICALFORM_HISTORY_TIME="Час"
PLG_RADICALFORM_HISTORY_DATE="Дата"
PLG_RADICALFORM_HISTORY_TARGET="TargetID"
PLG_RADICALFORM_HISTORY_IP="IP-адреса"
PLG_RADICALFORM_SHOWTARGET="Показувати TargetID у таблиці"
PLG_RADICALFORM_SHOWTARGET_DESCRIPTION="Відображати стовпець TargetID в історії надсилання форм. TargetID — це одержувач форми."
PLG_RADICALFORM_HISTORY_MESSAGE="Надіслані дані"
PLG_RADICALFORM_MAXLOGFILE="Очищати журнал при досягненні розміру (байт)"
PLG_RADICALFORM_MAXLOGFILE_DESC="Щоб журнал не займав надто багато місця, плагін може автоматично очищати його після досягнення вказаного розміру. Якщо очищення не потрібне, задайте велике значення, наприклад 100000000."
PLG_RADICALFORM_HISTORY_SIZE="Розмір файлу журналу: "
