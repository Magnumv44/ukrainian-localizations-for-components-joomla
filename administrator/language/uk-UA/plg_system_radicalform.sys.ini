PLG_RADICALFORM_LOG_MESSAGES="Повідомлення"
PLG_RADICALFORM_LOG_SPAM="Спам"
PLG_RADICALFORM_WELCOME_MESSAGE="Перейти до налаштувань плагіна — <a class=\"btn btn-primary text-white text-decoration-none\" href=\"index.php?option=com_plugins&view=plugins&filter[folder]=system&filter[element]=radicalform&filter[search]=\">Налаштування RadicalForm</a>"
PLG_RADICALFORM_HIDDENINFO="Додаткова інформація про відвідувача"
PLG_RADICALFORM_HIDDENINFO_DESCRIPTION="Кожна надіслана форма містить додаткову інформацію: реферер, адресу сторінки та роздільну здатність екрана. Ви можете вибрати, чи відображати цю інформацію в журналі. Після зміни параметра не забудьте зберегти налаштування."
PLG_RADICALFORM_ALTERNATIVEEMAILS_LABEL="Альтернативні адреси електронної пошти"
PLG_RADICALFORM_ALTERNATIVEEMAILS_DESC="Якщо адреса електронної пошти для доставки форми має відрізнятися від стандартної, вкажіть її тут і призначте відповідний Target ID, який буде використовуватися у формі."
PLG_RADICALFORM_REPLY_TO="Назва поля «Відповісти на»"
PLG_RADICALFORM_REPLY_TO_DESC="Якщо у формі є поле E-mail, його значення можна автоматично використовувати як адресу для відповіді. Вкажіть ім'я цього поля. Якщо ця функція не потрібна, залиште поле порожнім або вкажіть неіснуюче ім'я."
PLG_RADICALFORM_WRONG_PHP="Потрібна версія PHP не нижче %s"
PLG_RADICALFORM_GLUE="Роздільник для полів із кількома значеннями"
PLG_RADICALFORM_GLUE_DESCRIPTION="Якщо для поля дозволено введення кількох значень, вони будуть розділятися зазначеним символом."
PLG_RADICALFORM_EXTENDED_INFO="Додаткова інформація про відвідувача"
PLG_RADICALFORM_EXTENDED_INFO_DESC="Додавати до тексту листа розширену інформацію про відвідувача сайту: IP-адресу, реферер та роздільну здатність екрана."
PLG_RADICALFORM_JIVOSITE_LABEL="Увімкнути JivoSite"
PLG_RADICALFORM_JIVOSITE_DESCRIPTION="Увімкнути інтеграцію із сервісом JivoSite. Код JivoSite має бути вже встановлений на вашому сайті. Поля phone, email та name будуть передані до системи, якщо вони мають саме такі назви."
PLG_RADICALFORM_PROXY_LABEL="Увімкнути проксі"
PLG_RADICALFORM_PROXY_DESCRIPTION="Якщо ваш провайдер блокує доступ до серверів Telegram, можна використовувати проксі типу SOCKS5."
PLG_RADICALFORM_PROXYLOGIN_LABEL="Логін проксі"
PLG_RADICALFORM_PROXYLOGIN_DESCRIPTION="Логін вашого проксі-сервера."
PLG_RADICALFORM_PROXYPASSWORD_LABEL="Пароль проксі"
PLG_RADICALFORM_PROXYPASSWORD_DESCRIPTION="Пароль вашого проксі-сервера."
PLG_RADICALFORM_PROXYADDRESS_LABEL="Адреса проксі"
PLG_RADICALFORM_PROXYADDRESS_DESCRIPTION="Адреса вашого проксі-сервера."
PLG_RADICALFORM_PROXYPORT_LABEL="Порт проксі"
PLG_RADICALFORM_PROXYPORT_DESCRIPTION="Порт вашого проксі-сервера."
PLG_RADICALFORM_WRONG_JOOMLA="Ваша версія Joomla занадто стара. Плагін працюватиме лише з Joomla %s або новішої версії. Не вмикайте цей плагін!"
PLG_RADICALFORM_CUSTOMCODEON_LABEL="Використовувати власний код"
PLG_RADICALFORM_CUSTOMCODEON_DESCRIPTION="Можна використовувати власний код для всіх форм сайту або лише для форм із певним Target ID. Створіть файл у папці /templates/your_template/html/plg_system_radicalform і вкажіть його ім'я як Layout."
PLG_RADICALFORM_CUSTOMCODE_LABEL="Ім'я файлу"
PLG_RADICALFORM_CUSTOMCODE_DESC="Вкажіть ім'я файлу, розташованого у папці /templates/your_template/html/plg_system_radicalform."
PLG_RADICALFORM_KEEPALIVE="Підтримувати сесію користувача"
PLG_RADICALFORM_KEEPALIVE_DESC="Якщо користувач перебуває на сторінці довше, ніж дозволено налаштуваннями сесії Joomla, під час надсилання форми він може отримати повідомлення про помилковий CSRF-токен. Цей параметр дозволяє уникнути такої ситуації."
PLG_RADICALFORM_SHOWTARGET_DONTFORGET="Не забудьте зберегти зміни!"
PLG_RADICALFORM_SHOWTARGET_DONTFORGET_DESCRIPTION="Усі внесені зміни набудуть чинності лише після натискання кнопки «Зберегти»."
PLG_RADICALFORM_VERBOX_LABEL="Увімкнути Verbox"
PLG_RADICALFORM_VERBOX_DESCRIPTION="Увімкнути інтеграцію із сервісом Verbox. Поля phone, email та name будуть передані до картки клієнта. Код віджета Verbox повинен бути встановлений на вашому сайті."
PLG_RADICALFORM_HISTORY_FORMID="ID&nbsp;форми"
PLG_RADICALFORM_INSERTFORMID="Додавати ідентифікатор форми до повідомлення"
PLG_RADICALFORM_INSERTFORMID_DESC="Якщо увімкнути цей параметр, ідентифікатор форми буде додано до полів повідомлення. Його можна використовувати як мовну константу для зрозумілого опису."
PLG_RADICALFORM_SHOWFORMID="Показувати ID форми у таблиці"
PLG_RADICALFORM_SHOWFORMID_DESCRIPTION="Показувати стовпець Form ID в історії надсилання форм."
PLG_RADICALFORM_HISTORY_NUMBER_CLEAR="Скинути нумерацію"
PLG_RADICALFORM_INSERTIP="Вставляти IP-адресу у сторінку"
PLG_RADICALFORM_INSERTIP_DESC="Плагін може вставляти JavaScript-змінну RadicalForm.IP.ip з IP-адресою відвідувача. Це може бути корисно для систем аналітики."
PLG_RADICALFORM_TRACK_UTM_LABEL="Відстежувати UTM-мітки"
PLG_RADICALFORM_TRACK_UTM_DESC="Збирати UTM-мітки (utm_source, utm_medium, utm_campaign, utm_term, utm_content) з URL та передавати їх разом із формою."
PLG_RADICALFORM_TRACK_UTM_LIFETIME_LABEL="Час зберігання UTM-міток"
PLG_RADICALFORM_TRACK_UTM_LIFETIME_DESC="Вкажіть, скільки хвилин UTM-мітки будуть доступні для надсилання разом із формою. Значення 0 означає зберігання до завершення поточної сесії Joomla."
PLG_RADICALFORM_TRACK_UTM_ALLOWED_TAGS_LABEL="Дозволені UTM-мітки"
PLG_RADICALFORM_TRACK_UTM_ALLOWED_TAGS_DESC="Перелік GET-параметрів, які будуть збережені як UTM-мітки. Наприклад: utm_source, utm_medium, utm_campaign, utm_term, utm_content."
PLG_RADICALFORM_EXPORT_CSV="Експорт <strong>%s</strong> у CSV"
PLG_RADICALFORM_EXPORT_CSV_WITH_FIELDS="Експорт у CSV за полями"
PLG_RADICALFORM_WARNING_ABOUT_ROTATION="До очищення журналу залишилося <strong>%d</strong> днів. Кількість файлів ротації: <strong>%d</strong>.<br>Вимкнути або налаштувати параметри ротації можна <a href='index.php?option=com_scheduler&view=tasks' target='_blank'>тут</a>"
PLG_RADICALFORM_FILE_LOGS="Файли журналів: "
PLG_RADICALFORM_RF_CALL_9ON="Використовувати окремий код для виведення помилок"
PLG_RADICALFORM_RF_CALL_9ON_DESCRIPTION="Для виведення помилок під час роботи скрипта використовуватиметься окремий Javascript-код. Тут можна додати виведення помилок у консоль або інший спосіб журналювання."
PLG_RADICALFORM_RF_CALL_9="Javascript-код для виведення помилок"
PLG_RADICALFORM_RF_CALL_9_DESCRIPTION="Javascript-код, який використовуватиметься для обробки та виведення помилок. Доступні змінні: <strong>rfMessage</strong> — текст помилки, <strong>here</strong> — посилання на кнопку."
PLG_RADICALFORM_FILESPARAMS="Файли"
PLG_RADICALFORM_UPLOADENABLED_LABEL="Дозволити завантаження файлів"
PLG_RADICALFORM_UPLOADENABLED_DESCRIPTION="Якщо вимкнено, параметри завантаження файлів приховуються, а завантаження файлів через форми буде заблоковано."
PLG_RADICALFORM_ATTACHFILES_LABEL="Додавати файли до листа як вкладення"
PLG_RADICALFORM_ATTACHFILES_DESCRIPTION="Зазвичай файли, завантажені через форму, додаються до листа у вигляді посилань. Це дозволяє передавати великі файли без значних обмежень за розміром. За потреби можна вкладати їх безпосередньо до листа, однак це збільшує час відправлення і обмежується можливостями поштового сервера (зазвичай до 20 МБ)."
PLG_RADICALFORM_MAXSTORAGE="Максимальний розмір сховища (МБ)"
PLG_RADICALFORM_MAXSTORAGE_DESCRIPTION="Усі завантажені файли зберігаються на вашому хостингу. Вкажіть максимальний обсяг дискового простору, який дозволено використовувати. Якщо цей обсяг буде перевищено, користувач не зможе завантажити нові файли."
PLG_RADICALFORM_UPLOADSTORAGE="Каталог зберігання завантажених файлів"
PLG_RADICALFORM_UPLOADSTORAGE_DESCRIPTION="Повний шлях до каталогу, у якому зберігатимуться файли, завантажені через форму. Для підвищення безпеки цей каталог можна розмістити за межами директорії Joomla. Щоб автоматично згенерувати новий шлях, просто очистіть це поле."
PLG_RADICALFORM_DELIMITER="Роздільник вкладених файлів"
PLG_RADICALFORM_DELIMITER_DESCRIPTION="Символ, який використовуватиметься для розділення посилань на файли у листах та повідомленнях месенджерів."
PLG_RADICALFORM_MAXTIME="Термін зберігання вкладень на сайті (днів)"
PLG_RADICALFORM_MAXSTIME_DESCRIPTION="Максимальний термін зберігання файлів, отриманих через форму. Після його закінчення файли буде автоматично видалено."
PLG_RADICALFORM_DOWNLOADPATH="Шлях для завантаження файлів"
PLG_RADICALFORM_DOWNLOADPATH_DESCRIPTION="Частина URL-адреси, яка використовується для формування посилань на завантаження вкладених файлів."
PLG_RADICALFORM_TELEGRAMERROR="Сталася помилка"
PLG_RADICALFORM_TELEGRAMERROR_DESCRIPTION="<span>Сталася помилка</span>"
PLG_RADICALFORM_TOTALSIZE="Виділено для сховища: <strong>%s</strong> МБ, зайнято: <strong>%s</strong> МБ<br>"
PLG_RADICALFORM_TOTALFREE="Вільно у сховищі: <strong>%s</strong> МБ, загалом вільно у системі: <strong>%s</strong> МБ<br>"
