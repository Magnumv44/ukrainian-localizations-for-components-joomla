PLG_SYSTEM_COOKIEHINT_DESCRIPTION="<strong>CookieHint and Consent плагін для Joomla! 3.x/4.x/5.x</strong><br /><i>Як встановити власний текст:</i><br /><br />Ви можете встановити наступні мовні константи через інтерфейс адміністрування.<br />Перейдіть до розділу Система > Перевизначення констант<br /><br />PLG_SYSTEM_COOKIEHINT_INFO<br />(Текст попередження/сповіщення про файли cookie за замовчуванням)<br /><br />PLG_SYSTEM_COOKIEHINT_BTN_INFO<br />(Текст посилання для отримання додаткової інформації)<br /><br />PLG_SYSTEM_COOKIEHINT_BTN_OK<br />(Текст кнопки надання згоди використання cookie)<br /><br />PLG_SYSTEM_COOKIEHINT_BTN_NOTOK<br />(Текст кнопки відмови надання згоди використання cookie)<br /><br />Не забудьте вибрати вірну мову для перевизначання мовних констант та розділ використання для сайту, а не панелі адміністрування.<br /><br />"
